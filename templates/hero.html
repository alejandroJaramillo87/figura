/* Hero choreography — see tools/heroes/README.md for the full contract

   names in sync with the rules below (the validator enforces this). */

/* TODO: base state (intro elements at opacity: 0), .is-live intro
   keyframes (fg-{{ABBR}}-*), .is-settled complete final composition,
   .is-paused ambient pause hooks. Starter pop rules below match the
   generator stub — extend or replace them. */
.fg-{{NAME}} .{{ABBR}}-pop { opacity: 0; }
.fg-{{NAME}}.is-live .{{ABBR}}-pop {
  animation: fg-{{ABBR}}-pop 0.4s var(--ease-frames-coarse)
    calc(var(--i) * calc(var(--stagger) * 2)) both;
}
.fg-{{NAME}}.is-settled .{{ABBR}}-pop { opacity: 1; transform: none; }
@keyframes fg-{{ABBR}}-pop { from { opacity: 0; transform: translateY(16px); }
                             to   { opacity: 1; transform: none; } }

/* fg:begin reduced-motion v1 */
/* fg:end reduced-motion */
