/* --- hero choreography (raster / GIF-frame aesthetic) -------------- */
/* Heroes are ABSTRACT ART inspired by the post — no labels, no literal
   diagram anatomy. They should read like frames of an encoded GIF:
   - Pixel grid: 4 viewBox units = 1 raster pixel; snap every coordinate;
     shape-rendering: crispEdges on the <svg>; no rx rounding.
   - Frame-quantized motion: var(--ease-frames) / var(--ease-frames-coarse)
     timing; ambient loops as calc(var(--dur-tick) * N) with steps(N).
   - Texture from the RASTER KIT in shared/effects.css: Bayer dither
     patterns for posterized fills, a scanline overlay, static
     feTurbulence grain (never animate filter primitives), dithered
     halos (stepped blink) instead of blur glows, staircase lines
     instead of smooth beziers. Rename all XX- ids to {{ABBR}}-. */
/* Lifecycle (driven by the hero-start block):
     .is-live    — added at first ~30% visibility; fires the intro
     .is-settled — added after INTRO_MS (or immediately under
                   prefers-reduced-motion); gates the ambient loop
     .is-paused  — toggled while scrolled off-screen after the intro;
                   map it to animation-play-state: paused on ambient
                   elements. Intro plays once per page load.
   Conventions:
   - Intro elements start at opacity: 0 and animate in via
     fg-{{ABBR}}-enter-* keyframes with `animation-fill-mode: both`,
     delayed per element: animation-delay: calc(var(--i) * var(--stagger))
     with style="--i: N" on the element. Entrances use
     var(--ease-overshoot) / var(--dur-hero-in); long settles use
     var(--ease-out).
   - The .is-settled state (no .is-live needed) must render the COMPLETE
     final composition — it is what reduced-motion users see.
   - Ambient loop: at most ~3 concurrent animated elements, gated on
     .is-settled, paused via .is-paused.
   - SMIL comets are intro-only and MUST have the display:none
     reduced-motion gate. */
