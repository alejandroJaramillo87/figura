<h1>The OS setup pipeline, in order</h1>
<p>Step through the eight-stage setup order, top to bottom: each stage lights up with the script that automates it, a comet carries the flow to the next stage, and the driver stage flags its reboot.</p>

<!-- fg:embed-start -->
<div class="fg-diagram fg-setup-pipeline">
<style>
/* fg:begin palette-classic v1 */
.fg-setup-pipeline {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --dur-quick: 0.3s;
  --dur-fast: 0.45s;
  --dur-slow: 0.7s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
:where(.fg-setup-pipeline .fg-fill-accent) { fill: var(--accent); }
:where(.fg-setup-pipeline .fg-stroke-accent) { stroke: var(--accent); }
:where(.fg-setup-pipeline .fg-fill-ok) { fill: var(--ok); }
:where(.fg-setup-pipeline .fg-stroke-ok) { stroke: var(--ok); }
:where(.fg-setup-pipeline .fg-fill-warn) { fill: var(--warn); }
:where(.fg-setup-pipeline .fg-stroke-warn) { stroke: var(--warn); }
:where(.fg-setup-pipeline .fg-fill-hot) { fill: var(--hot); }
:where(.fg-setup-pipeline .fg-stroke-hot) { stroke: var(--hot); }
:where(.fg-setup-pipeline .fg-fill-violet) { fill: var(--violet); }
:where(.fg-setup-pipeline .fg-stroke-violet) { stroke: var(--violet); }
:where(.fg-setup-pipeline .fg-fill-line) { fill: var(--line); }
:where(.fg-setup-pipeline .fg-stroke-line) { stroke: var(--line); }
:where(.fg-setup-pipeline .fg-fill-border) { fill: var(--border); }
:where(.fg-setup-pipeline .fg-stroke-border) { stroke: var(--border); }
:where(.fg-setup-pipeline .fg-fill-text) { fill: var(--text); }
:where(.fg-setup-pipeline .fg-stroke-text) { stroke: var(--text); }
:where(.fg-setup-pipeline .fg-fill-muted) { fill: var(--muted); }
:where(.fg-setup-pipeline .fg-stroke-muted) { stroke: var(--muted); }
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-setup-pipeline {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-setup-pipeline svg { display: block; width: 100%; height: auto; }
.fg-setup-pipeline text { font-family: inherit; }
/* fg:end panel-base */
.fg-setup-pipeline {
  padding: 16px 16px 12px;
}


.fg-setup-pipeline .sup-block {
  fill: var(--panel); stroke: var(--border); stroke-width: 1.5;
  transition: fill var(--dur-fast) var(--ease), stroke var(--dur-fast);
}
.fg-setup-pipeline .sup-title { fill: var(--muted); font-size: 14px; font-weight: 600; text-anchor: middle; transition: fill var(--dur-fast); }
.fg-setup-pipeline .sup-script { fill: var(--muted); font-size: 11px; font-family: var(--mono); text-anchor: middle; opacity: 0.75; transition: fill var(--dur-fast); }
.fg-setup-pipeline .sup-num { fill: var(--muted); font-size: 11px; font-family: var(--mono); text-anchor: end; opacity: 0.6; transition: fill var(--dur-fast), opacity var(--dur-fast); }
.fg-setup-pipeline .sup-sub { fill: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.fg-setup-pipeline .sup-rail { stroke: var(--border); stroke-width: 2; opacity: 0.7; }
.fg-setup-pipeline .sup-reboot { fill: var(--warn); font-size: 11px; text-anchor: start; opacity: 0; transition: opacity var(--dur-fast); }

/* faint guide connectors, always visible */
.fg-setup-pipeline .sup-conn {
  stroke: var(--line); stroke-width: 2; fill: none; opacity: 0.4;
  transition: opacity var(--dur-fast);
}

/* draw-in overlay: the completed path turns green as stages finish */
.fg-setup-pipeline .sup-flow {
  stroke: var(--ok); stroke-width: 2.5; fill: none; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
  transition: stroke-dashoffset var(--dur-slow) var(--ease), opacity var(--dur-quick);
}
.fg-setup-pipeline .sup-flow.is-drawn { stroke-dashoffset: 0; opacity: 0.85; }

/* stage states: active (accent) then done (ok) */
.fg-setup-pipeline .sup-stage.is-active .sup-block { fill: var(--accent-dim); stroke: var(--accent); }
.fg-setup-pipeline .sup-stage.is-done .sup-block { fill: var(--ok-dim); stroke: var(--ok); }
.fg-setup-pipeline .sup-stage.is-done .sup-title,
.fg-setup-pipeline .sup-stage.is-active .sup-title { fill: var(--text); }
.fg-setup-pipeline .sup-stage.is-active .sup-script { fill: var(--accent); opacity: 1; }
.fg-setup-pipeline .sup-stage.is-active .sup-num { fill: var(--accent); opacity: 1; }
.fg-setup-pipeline .sup-stage.is-done .sup-num { fill: var(--ok); opacity: 0.9; }
.fg-setup-pipeline .sup-stage.is-active .sup-reboot,
.fg-setup-pipeline .sup-stage.is-done .sup-reboot { opacity: 1; }

/* glow halo on the active stage: pre-blurred rect, opacity pulse only */
.fg-setup-pipeline .sup-halo { filter: blur(7px); opacity: 0; transition: opacity var(--dur-fast); }
.fg-setup-pipeline .sup-stage.is-active .sup-halo { animation: fg-sup-glow 1.6s var(--ease) infinite alternate; }
@keyframes fg-sup-glow { from { opacity: 0.16; } to { opacity: 0.45; } }

/* reboot marker flashes twice when its stage activates */
.fg-setup-pipeline .sup-stage.is-active .sup-reboot { animation: fg-sup-flash 0.7s var(--ease) 2; }
@keyframes fg-sup-flash { 40% { opacity: 0.1; } }

/* step-advance comets: hidden except during their step; SMIL kicked by JS */
.fg-setup-pipeline .sup-comet { opacity: 0; transition: opacity var(--dur-quick); }
.fg-setup-pipeline.is-step-2 .sup-comet-1, .fg-setup-pipeline.is-step-3 .sup-comet-2,
.fg-setup-pipeline.is-step-4 .sup-comet-3, .fg-setup-pipeline.is-step-5 .sup-comet-4,

.fg-setup-pipeline.is-step-8 .sup-comet-7 { opacity: 1; }

/* step caption box: fixed height so text swaps never reflow the page */
/* fg:begin caption-box v1 */
.fg-setup-pipeline .fg-caption {
  margin-top: 12px; padding: 10px 14px;
  background: var(--panel); border-left: 3px solid var(--fg-cap-accent, var(--accent));
  border-radius: 0 8px 8px 0;
  /* min-height reserves space for the longest caption: no page reflow */
  color: var(--text); font-size: 13px; min-height: var(--fg-cap-minh, 4.2em);

.fg-setup-pipeline .fg-caption.fg-cap-grid { display: grid; }
.fg-setup-pipeline .fg-cap-ghost { grid-area: 1 / 1; visibility: hidden; }
.fg-setup-pipeline .fg-cap-live { grid-area: 1 / 1; }
.fg-setup-pipeline [data-info]:focus { outline: none; }
.fg-setup-pipeline [data-info]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* fg:end caption-box */
.fg-setup-pipeline .fg-caption { color: var(--muted); transition: color var(--dur-fast) var(--ease); }
.fg-setup-pipeline .fg-caption.is-active { color: var(--text); }
.fg-setup-pipeline .fg-caption strong { color: var(--accent); font-weight: 600; }
.fg-setup-pipeline .fg-caption code {

/* fg:begin controls-bar v1 */
.fg-setup-pipeline .fg-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.fg-setup-pipeline .fg-controls button {

.fg-setup-pipeline .fg-controls button:hover { border-color: var(--fg-ctl-accent, var(--accent)); }
.fg-setup-pipeline .fg-controls [data-fg="counter"] {

/* fg:end reduced-motion */

<script>(() => {
  const root = document.currentScript.closest('.fg-diagram');
  // fg:begin instance-ids v1
  // Ids are page-global once inlined. In the second and later copies of this
  // diagram on one page, suffix every id and rewrite the references to them
  // (href, url(#...), SMIL syncbase begin/end), so animation timing binds to
  // this copy's own elements instead of the first copy's.
  {
    const copies = [...document.querySelectorAll('.fg-diagram.' + root.classList[1])];
    const nth = copies.indexOf(root);
    if (nth > 0) {
      const sfx = '-i' + nth;
      const ids = new Set();
      root.querySelectorAll('[id]').forEach((el) => { ids.add(el.id); el.id += sfx; });
      root.querySelectorAll('*').forEach((el) => {
        for (const a of [...el.attributes]) {
          let v = a.value;
          if ((a.name === 'href' || a.name === 'xlink:href') && v[0] === '#' && ids.has(v.slice(1))) v += sfx;
          else if (a.name === 'begin' || a.name === 'end') {
            v = v.replace(/([\w-]+)\.(begin|end)/g, (m, id, e) => (ids.has(id) ? id + sfx + '.' + e : m));
          } else v = v.replace(/url\(#([\w-]+)\)/g, (m, id) => (ids.has(id) ? 'url(#' + id + sfx + ')' : m));
          if (v !== a.value) el.setAttribute(a.name, v);
        }
      });
    }
  }
  // fg:end instance-ids
  const TOTAL = 8, STEP_MS = 2600;

  const CAPTIONS = [
    'Press play or step through the setup order.',
    ['Ubuntu 24.04', 'Clean LTS install on the OS SSD. BIOS/UEFI settings come first; everything after this stage is scripted.'],
    ['User & terminal', 'Sudo and device groups (docker, video, render), then zsh, Tilix, and build tools. Also runs the first full apt upgrade.'],
    ['Security', 'Default-deny UFW allowing only SSH and the Docker bridge — services bind loopback, so no inference port is opened. Plus Fail2Ban, unattended upgrades, auditd, kernel hardening, and raised ulimits (memlock, file descriptors).'],
    ['Data SSD', 'Formats and mounts the second NVMe at /mnt/ai-data with noatime, creates the models, training, interp, benchmarks, logs and cache tree, and symlinks framework caches. Supports --dry-run.'],
    ['NVIDIA driver', 'Purges old drivers and installs the pinned nvidia-driver-580-server-open. Requires a reboot to load the new kernel modules; persistence mode and the power limit are set separately.'],
    ['CUDA Toolkit', 'Installs the toolkit and appends PATH and LD_LIBRARY_PATH entries to ~/.zshrc. No reboot: a new shell is enough to pick up nvcc.'],
    ['cuDNN', 'Detects the installed CUDA major version from nvcc and installs the matching cudnn9 package. No reboot needed.'],
    ['Docker + toolkit', 'Docker CE, Compose, and the NVIDIA Container Toolkit — containers now see the GPU via the host driver. Setup complete: verify with nvidia-smi and a CUDA container.'],
  ];

  // fg:begin timeline-core v1
  let step = 0, timer = null, held = false; // held: the reader paused; autoplay stays off
  function apply() {
    for (let i = 0; i <= TOTAL; i++) root.classList.remove('is-step-' + i);
    root.classList.add('is-step-' + step);
    root.dispatchEvent(new CustomEvent('fg:step', { detail: { step } }));
  }
  const tl = {
    get step() { return step; },
    get playing() { return timer !== null; },
    go(n) { step = ((n % (TOTAL + 1)) + TOTAL + 1) % (TOTAL + 1); apply(); },
    next() { tl.go(step + 1); },
    prev() { tl.go(step - 1); },
    play() { if (!timer) { timer = setInterval(() => tl.next(), STEP_MS); root.classList.add('is-playing'); } },
    pause() { clearInterval(timer); timer = null; root.classList.remove('is-playing'); },
  };
  const btn = (name) => root.querySelector('[data-fg="' + name + '"]');
  btn('prev').addEventListener('click', () => { held = true; tl.pause(); tl.prev(); });
  btn('next').addEventListener('click', () => { held = true; tl.pause(); tl.next(); });
  btn('play').addEventListener('click', () => { held = tl.playing; held ? tl.pause() : tl.play(); });
  const counter = btn('counter');
  function sync() {
    if (counter) counter.textContent = tl.step + ' / ' + TOTAL;
    btn('play').textContent = tl.playing ? '\u275A\u275A' : '\u25B6\uFE0E'; // FE0E: text glyph, not emoji
    btn('play').setAttribute('aria-pressed', String(tl.playing));
  }
  root.addEventListener('fg:step', sync);
  root.querySelectorAll('.fg-controls button').forEach((b) => b.addEventListener('click', sync));
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // fg:end timeline-core

  let lastStep = 0;
  root.addEventListener('fg:step', (e) => {
    const s = e.detail.step;
    root.querySelectorAll('.sup-stage').forEach((g, i) => {
      const n = i + 1;
      g.classList.toggle('is-active', n === s);
      g.classList.toggle('is-done', n < s);
    });
    // connector i is drawn once stage i+1 has been reached
    root.querySelectorAll('.sup-flow').forEach((p, i) => {
      p.classList.toggle('is-drawn', s >= i + 2);
    });
    // comet rides the connector only on a single forward advance
    if (!reduced && s === lastStep + 1 && s >= 2) {
      const head = root.querySelector('#sup-c' + (s - 1) + '-head');
      if (head) head.beginElement();
    }
    lastStep = s;
  });

  // fg:begin caption-core v1
  // Captions change at runtime. Every variant is stacked invisibly in one
  // grid cell, so the box takes the tallest variant's height at any column
  // width and changing the caption never reflows the post.
  const caption = root.querySelector('[data-fg="caption"]');
  const captionInitial = caption ? caption.innerHTML : '';
  const captionText = document.createElement('span');
  function reserveCaption(variants) {
    if (!caption) return;
    caption.textContent = '';
    caption.classList.add('fg-cap-grid');
    for (const html of [captionInitial, ...variants]) {
      const ghost = document.createElement('span');
      ghost.className = 'fg-cap-ghost';
      ghost.setAttribute('aria-hidden', 'true');
      ghost.innerHTML = html;
      caption.appendChild(ghost);
    }
    captionText.className = 'fg-cap-live';
    captionText.setAttribute('aria-live', 'polite');
    captionText.innerHTML = captionInitial;
    caption.appendChild(captionText);
  }
  function setCaption(html) { captionText.innerHTML = html; }
  function escHtml(t) { const s = document.createElement('span'); s.textContent = t; return s.innerHTML; }
  // fg:end caption-core
  // fg:begin step-caption v1
  // CAPTIONS[step] is plain text, or [title, text] shown as "N. title — text"
  // with the caption marked active.
  function stepCaptionHtml(s) {
    const c = CAPTIONS[s];
    return Array.isArray(c) ? '<strong>' + escHtml(s + '. ' + c[0]) + '</strong> \u2014 ' + escHtml(c[1]) : escHtml(c);
  }
  reserveCaption(CAPTIONS.map((c, s) => stepCaptionHtml(s)));
  root.addEventListener('fg:step', (e) => {
    setCaption(stepCaptionHtml(e.detail.step));
    if (caption) caption.classList.toggle('is-active', Array.isArray(CAPTIONS[e.detail.step]));
  });
  // fg:end step-caption

  // fg:begin timeline-start v1
  apply();
  if (reduced) {
    tl.go(TOTAL); // show final state, manual stepping still available
  } else {
    const io = new IntersectionObserver(
      // The first callback reports any overlap as intersecting, so test the
      // ratio; a reader who paused keeps control until they press play.
      (entries) => entries.forEach((e) => {
        if (e.intersectionRatio < 0.3) tl.pause();
        else if (!held) tl.play();
      }),
      { threshold: 0.3 }
    );
    io.observe(root);
  }
  // fg:end timeline-start
})();</script>
