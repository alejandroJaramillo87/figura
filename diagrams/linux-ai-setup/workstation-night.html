<h1>Workstation at night — hero</h1>
<p>Pixel-art night scene: a dark room where the monitor is the only light source — it boots through POST, a logo, and a desktop, and its glow spills onto the wall, desk, and floor in the color of each boot phase, while rain falls past a city skyline outside the window.</p>

<style>
/* fg:begin palette-classic v1 */
.fg-workstation-night {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 6px;
  --dur-step: 700ms;
  --dur-fast: 0.45s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-hero-in: 900ms;
  --stagger: 80ms;
  --ease-frames: steps(10);
  --ease-frames-coarse: steps(4, jump-none);
  --dur-tick: 100ms;
  --ease-frames-fine: steps(24, jump-none);
  --dur-flicker: 800ms;
  --px-outline: #0b1020;
  --px-steel-1: #232c44;
  --px-steel-2: #3b4a5e;
  --px-steel-3: #64748b;
  --px-steel-4: #a7b0b8;
  --px-amber-1: #92400e;
  --px-amber-2: #f59e0b;
  --px-amber-3: #fcd34d;
  --px-green-1: #166534;
  --px-green-2: #34d399;
  --px-green-3: #a7f3d0;
  --px-sky-1: #0369a1;
  --px-sky-2: #38bdf8;
  --px-sky-3: #bae6fd;
}
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-workstation-night {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-workstation-night svg { display: block; width: 100%; height: auto; }
.fg-workstation-night text { font-family: inherit; }
/* fg:end panel-base */
.fg-workstation-night {
  padding: 0; /* heroes are full-bleed inside the panel */
  overflow: hidden;
}
.fg-workstation-night svg { shape-rendering: crispEdges; }

/* --- static scene defaults ------------------------------------------ */
/* Night scene on the --px-* sprite ramps: everything sits in shadow
   shades; the monitor's boot flipbook drives a color-changed glow
   spill (per-phase overlay groups, dithered edges, no filters). */
.fg-workstation-night .wsn-pop { opacity: 0; }
.fg-workstation-night .wsn-led { opacity: 0; }
.fg-workstation-night .wsn-flash-a,
.fg-workstation-night .wsn-flash-b,
.fg-workstation-night .wsn-scene-post,
.fg-workstation-night .wsn-scene-logo,
.fg-workstation-night .wsn-scene-desktop { opacity: 0; }
.fg-workstation-night .wsn-post-row { opacity: 0; }
.fg-workstation-night .wsn-boot-dot { opacity: 0; }
.fg-workstation-night .wsn-fan-2,
.fg-workstation-night .wsn-fan-3,
.fg-workstation-night .wsn-fan-4 { opacity: 0; }
.fg-workstation-night .wsn-rain-2 { opacity: 0; }
.fg-workstation-night .wsn-sp-flash,
.fg-workstation-night .wsn-sp-post,
.fg-workstation-night .wsn-sp-logo,
.fg-workstation-night .wsn-sp-desktop { opacity: 0; }

/* --- intro: master 7s stepped timeline on .is-live ------------------ */
.fg-workstation-night.is-live .wsn-pop {
  animation: fg-wsn-pop 0.4s var(--ease-frames-coarse)
    calc(var(--i) * calc(var(--stagger) * 2)) both;
}
.fg-workstation-night.is-live .wsn-led {
  animation: fg-wsn-led-on 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-scene-off {
  animation: fg-wsn-sc-off 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-flash-a {
  animation: fg-wsn-sc-flash-a 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-flash-b {
  animation: fg-wsn-sc-flash-b 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-scene-post {
  animation: fg-wsn-sc-post 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-post-row {
  animation: fg-wsn-on 0.1s steps(1, jump-end)
    calc(2.5s + var(--i) * 0.3s) both;
}
.fg-workstation-night.is-live .wsn-scene-logo {
  animation: fg-wsn-sc-logo 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-boot-dot {
  animation: fg-wsn-on 0.1s steps(1, jump-end)
    calc(4.7s + var(--i) * 0.15s) both;
}
.fg-workstation-night.is-live .wsn-scene-desktop {
  animation: fg-wsn-sc-desktop 7s steps(1, jump-end) both;
}
/* glow spill tracks the screen flipbook exactly */
.fg-workstation-night.is-live .wsn-sp-flash {
  animation: fg-wsn-sp-flash 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-sp-post {
  animation: fg-wsn-sc-post 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-sp-logo {
  animation: fg-wsn-sc-logo 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-sp-desktop {
  animation: fg-wsn-sc-desktop 7s steps(1, jump-end) both;
}
.fg-workstation-night.is-live .wsn-fan-1 {
  animation: fg-wsn-fan-f1 calc(var(--dur-tick) * 4) steps(1, jump-end) 1.9s infinite;
}
.fg-workstation-night.is-live .wsn-fan-2 {
  animation: fg-wsn-fan-f2 calc(var(--dur-tick) * 4) steps(1, jump-end) 1.9s infinite;
}
.fg-workstation-night.is-live .wsn-fan-3 {
  animation: fg-wsn-fan-f3 calc(var(--dur-tick) * 4) steps(1, jump-end) 1.9s infinite;
}
.fg-workstation-night.is-live .wsn-fan-4 {
  animation: fg-wsn-fan-f4 calc(var(--dur-tick) * 4) steps(1, jump-end) 1.9s infinite;
}

@keyframes fg-wsn-pop { from { opacity: 0; transform: translateY(16px); }
                        to   { opacity: 1; transform: none; } }
@keyframes fg-wsn-on { to { opacity: 1; } }
@keyframes fg-wsn-led-on   { 0%, 25% { opacity: 0; } 26%, 100% { opacity: 1; } }
/* screen flipbook: off -> flash T (31%) -> flash sky (32%) -> post -> logo -> desktop */
@keyframes fg-wsn-sc-off     { 0%, 30% { opacity: 1; } 31%, 100% { opacity: 0; } }
@keyframes fg-wsn-sc-flash-a { 0%, 30% { opacity: 0; } 31%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
@keyframes fg-wsn-sc-flash-b { 0%, 31% { opacity: 0; } 32%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
@keyframes fg-wsn-sc-post    { 0%, 33% { opacity: 0; } 34%, 64% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes fg-wsn-sc-logo    { 0%, 64% { opacity: 0; } 65%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
@keyframes fg-wsn-sc-desktop { 0%, 76% { opacity: 0; } 77%, 100% { opacity: 1; } }
/* flash spill covers both flash frames */
@keyframes fg-wsn-sp-flash   { 0%, 30% { opacity: 0; } 31%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
/* fan flipbook: 4 frames, one visible per tick */
@keyframes fg-wsn-fan-f1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
@keyframes fg-wsn-fan-f2 { 0%, 24% { opacity: 0; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes fg-wsn-fan-f3 { 0%, 49% { opacity: 0; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0; } }
@keyframes fg-wsn-fan-f4 { 0%, 74% { opacity: 0; } 75%, 100% { opacity: 1; } }

/* --- settled state (complete final composition; the reduced-motion
       rendering) ---------------------------------------------------- */
.fg-workstation-night.is-settled .wsn-pop { opacity: 1; transform: none; }
.fg-workstation-night.is-settled .wsn-led { opacity: 1; }
.fg-workstation-night.is-settled .wsn-scene-off,
.fg-workstation-night.is-settled .wsn-flash-a,
.fg-workstation-night.is-settled .wsn-flash-b,
.fg-workstation-night.is-settled .wsn-scene-post,
.fg-workstation-night.is-settled .wsn-scene-logo { opacity: 0; }
.fg-workstation-night.is-settled .wsn-scene-desktop { opacity: 1; }
.fg-workstation-night.is-settled .wsn-post-row,
.fg-workstation-night.is-settled .wsn-boot-dot { opacity: 1; }
.fg-workstation-night.is-settled .wsn-sp-flash,
.fg-workstation-night.is-settled .wsn-sp-post,
.fg-workstation-night.is-settled .wsn-sp-logo { opacity: 0; }
.fg-workstation-night.is-settled .wsn-sp-desktop { opacity: 1; }
.fg-workstation-night.is-settled .wsn-fan-1 { opacity: 1; }
.fg-workstation-night.is-settled .wsn-fan-2,
.fg-workstation-night.is-settled .wsn-fan-3,
.fg-workstation-night.is-settled .wsn-fan-4 { opacity: 0; }

/* --- ambient loop (exactly 3: rain, twinkle, cursor) ---------------- */
.fg-workstation-night.is-live .wsn-rain-1,
.fg-workstation-night.is-settled .wsn-rain-1 {
  animation: fg-wsn-rain-f1 calc(var(--dur-tick) * 8) steps(1, jump-end) infinite;
}
.fg-workstation-night.is-live .wsn-rain-2,
.fg-workstation-night.is-settled .wsn-rain-2 {
  animation: fg-wsn-rain-f2 calc(var(--dur-tick) * 8) steps(1, jump-end) infinite;
}
.fg-workstation-night.is-settled .wsn-twinkle {
  animation: fg-wsn-twinkle calc(var(--dur-tick) * 16) steps(1, jump-end) infinite;
}
.fg-workstation-night.is-settled .wsn-cursor {
  animation: fg-wsn-cursor calc(var(--dur-tick) * 10) steps(2, jump-none) infinite;
}
.fg-workstation-night.is-paused .wsn-rain-1,
.fg-workstation-night.is-paused .wsn-rain-2,
.fg-workstation-night.is-paused .wsn-twinkle,
.fg-workstation-night.is-paused .wsn-cursor { animation-play-state: paused; }

@keyframes fg-wsn-rain-f1 { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes fg-wsn-rain-f2 { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes fg-wsn-twinkle { 0%, 60% { opacity: 1; } 61%, 75% { opacity: 0.3; } 76%, 100% { opacity: 1; } }
@keyframes fg-wsn-cursor { 50% { opacity: 0; } }

/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-workstation-night, .fg-workstation-night * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */

<script>
(() => {
  const INTRO_MS = 7000; // flash ~2.2s, POST 2.4-4.5s, logo 4.5-5.4s, desktop 5.4s

  // fg:begin hero-start v1
  const root = document.currentScript.closest('.fg-diagram');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    root.classList.add('is-settled'); // final composition, no motion
  } else {
    let started = false;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!started) {
        if (!e.isIntersecting) return;
        started = true; // intro plays once per page load
        root.classList.add('is-live');
        setTimeout(() => root.classList.add('is-settled'), INTRO_MS);
      } else {
        root.classList.toggle('is-paused', !e.isIntersecting);
      }
    }), { threshold: 0.3 });
    io.observe(root);
  }
  // fg:end hero-start
})();
</script>
