<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Boot-up strata — hero</title>

<body>
<h1>Boot-up strata — hero</h1>
<p>Abstract raster hero: dithered strata assemble bottom-up like a machine booting — seam lines, reboot flashes, RGB-split boot jitter, and a posterized glow cap settling into a quiet hum.</p>

<!-- fg:embed-start -->
<div class="fg-diagram fg-boot-strata-hero">
<style>
/* fg:begin palette-classic v1 */
.fg-boot-strata-hero {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 6px;
  --dur-step: 700ms;
  --dur-fast: 0.45s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-hero-in: 900ms;
  --stagger: 80ms;
  --ease-frames: steps(10);
  --ease-frames-coarse: steps(4, jump-none);
  --dur-tick: 100ms;
  --ease-frames-fine: steps(24, jump-none);
  --dur-flicker: 800ms;
  --px-outline: #0b1020;
  --px-steel-1: #232c44;
  --px-steel-2: #3b4a5e;
  --px-steel-3: #64748b;
  --px-steel-4: #a7b0b8;
  --px-amber-1: #92400e;
  --px-amber-2: #f59e0b;
  --px-amber-3: #fcd34d;
  --px-green-1: #166534;
  --px-green-2: #34d399;
  --px-green-3: #a7f3d0;
  --px-sky-1: #0369a1;
  --px-sky-2: #38bdf8;
  --px-sky-3: #bae6fd;
}
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-boot-strata-hero {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-boot-strata-hero svg { display: block; width: 100%; height: auto; }
.fg-boot-strata-hero text { font-family: inherit; }
/* fg:end panel-base */
.fg-boot-strata-hero {
  padding: 0; /* heroes are full-bleed inside the panel */
  overflow: hidden;
}
.fg-boot-strata-hero svg { shape-rendering: crispEdges; }

/* --- static scene (all geometry on the 4-unit pixel grid) ----------- */
.fg-boot-strata-hero .bst-stratum { opacity: 0; }
.fg-boot-strata-hero .bst-seam { fill: none; stroke: var(--line); stroke-width: 4;
  stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0.8; }
.fg-boot-strata-hero .bst-split { isolation: isolate; }
.fg-boot-strata-hero .bst-split-r { fill: #ff0044; mix-blend-mode: screen; opacity: 0; }
.fg-boot-strata-hero .bst-split-c { fill: #00ffee; mix-blend-mode: screen; opacity: 0; }
.fg-boot-strata-hero .bst-flash { opacity: 0; pointer-events: none; }
.fg-boot-strata-hero .bst-cap { opacity: 0.85; }
.fg-boot-strata-hero .bst-cap-cover { fill: var(--bg); }
.fg-boot-strata-hero .bst-comet { fill: var(--text); opacity: 0; offset-rotate: 0deg; }
.fg-boot-strata-hero .bst-c1 { offset-path: path('M 320 88 V 496'); }
.fg-boot-strata-hero .bst-c2 { offset-path: path('M 636 88 V 496'); }
.fg-boot-strata-hero .bst-c3 { offset-path: path('M 956 88 V 496'); }
.fg-boot-strata-hero .bst-halo-px { opacity: 0; }
.fg-boot-strata-hero .bst-roll { opacity: 0; }

/* --- intro (fires on .is-live; frame-quantized, staggered via --i) -- */
.fg-boot-strata-hero.is-live .bst-stratum {
  animation: fg-bst-rise 0.6s var(--ease-frames-coarse)
    calc(var(--i) * calc(var(--stagger) * 4)) both;
}
.fg-boot-strata-hero.is-live .bst-seam {
  animation: fg-bst-draw 0.8s var(--ease-frames)
    calc(0.5s + var(--i) * calc(var(--stagger) * 4)) both;
}
.fg-boot-strata-hero.is-live .bst-split-r,
.fg-boot-strata-hero.is-live .bst-split-c {
  animation: fg-bst-splitjit calc(var(--dur-tick) * 4) steps(2, jump-none)
    calc(0.2s + var(--i) * calc(var(--stagger) * 4)) 3;
}
.fg-boot-strata-hero.is-live .bst-flash-1 {
  animation: fg-bst-flash calc(var(--dur-tick) * 3) steps(1, jump-end) 2.6s both;
}
.fg-boot-strata-hero.is-live .bst-flash-2 {
  animation: fg-bst-flash calc(var(--dur-tick) * 3) steps(1, jump-end) 4.4s both;
}
.fg-boot-strata-hero.is-live .bst-cap-cover {
  animation: fg-bst-uncover calc(var(--dur-tick) * 8) steps(1, jump-end) 5.2s both;
}
.fg-boot-strata-hero.is-live .bst-comet {
  animation: fg-bst-drop 1s var(--ease-frames-fine) 5.8s both;
}
.fg-boot-strata-hero.is-live .bst-c2 { animation-delay: 6.05s; }
.fg-boot-strata-hero.is-live .bst-c3 { animation-delay: 6.3s; }

@keyframes fg-bst-rise {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: none; }
}
@keyframes fg-bst-draw { to { stroke-dashoffset: 0; } }
@keyframes fg-bst-splitjit {
  0%  { opacity: 1; transform: none; }
  50% { opacity: 1; transform: translateX(4px); }
  100% { opacity: 0; transform: none; }
}
@keyframes fg-bst-flash { 0% { opacity: 0; } 33% { opacity: 0.22; } 66%, 100% { opacity: 0; } }
@keyframes fg-bst-uncover {
  0%   { fill: var(--bg); }
  25%  { fill: url(#bst-cvr75); }
  50%  { fill: url(#bst-cvr50); }
  75%  { fill: url(#bst-cvr25); }
  100% { fill: none; }
}
@keyframes fg-bst-drop {
  0% { offset-distance: 0%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}

/* --- settled state (complete final composition; the reduced-motion
       rendering) ---------------------------------------------------- */
.fg-boot-strata-hero.is-settled .bst-stratum { opacity: 1; transform: none; }
.fg-boot-strata-hero.is-settled .bst-seam { stroke-dashoffset: 0; }
.fg-boot-strata-hero.is-settled .bst-cap-cover { fill: none; }
.fg-boot-strata-hero.is-settled .bst-halo-px { opacity: 0.2; }
.fg-boot-strata-hero.is-settled .bst-roll { opacity: 0.05; }

/* --- ambient loop (≤3 concurrent; frame-ticked; gated on settle) ---- */
.fg-boot-strata-hero.is-settled .bst-halo-px {
  animation: fg-bst-blink calc(var(--dur-tick) * 8) steps(2, jump-none) infinite;
}
.fg-boot-strata-hero.is-settled .bst-roll {
  animation: fg-bst-roll 6s steps(12) infinite;
}
.fg-boot-strata-hero.is-settled .bst-scan-b {
  animation: fg-bst-lace var(--dur-flicker) steps(2, jump-none) infinite;
}
.fg-boot-strata-hero.is-paused .bst-halo-px,
.fg-boot-strata-hero.is-paused .bst-roll,
.fg-boot-strata-hero.is-paused .bst-scan-b { animation-play-state: paused; }

@keyframes fg-bst-blink { 50% { opacity: 0.35; } }
@keyframes fg-bst-roll { from { transform: translateY(-40px); } to { transform: translateY(500px); } }
@keyframes fg-bst-lace { 0% { opacity: 1; } 50% { opacity: 0.9; } }

/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-boot-strata-hero, .fg-boot-strata-hero * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */
@media (prefers-reduced-motion: reduce) {
  .fg-boot-strata-hero .bst-roll { opacity: 0 !important; }
  .fg-boot-strata-hero .bst-split-r, .fg-boot-strata-hero .bst-split-c { opacity: 0 !important; }
  .fg-boot-strata-hero .bst-comet { opacity: 0 !important; }
}
</style>

<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img"

  <defs>

<script>
(() => {
  const INTRO_MS = 7000; // strata ~2.6s, flashes 2.6/4.4s, uncover 5.2s, comets end ~6.6s

  // fg:begin hero-start v1
  const root = document.currentScript.closest('.fg-diagram');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    root.classList.add('is-settled'); // final composition, no motion
  } else {
    let started = false;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!started) {
        if (!e.isIntersecting) return;
        started = true; // intro plays once per page load
        root.classList.add('is-live');
        setTimeout(() => root.classList.add('is-settled'), INTRO_MS);
      } else {
        root.classList.toggle('is-paused', !e.isIntersecting);
      }
    }), { threshold: 0.3 });
    io.observe(root);
  }
  // fg:end hero-start
})();
</script>
