<h1>Robot boots Ubuntu — hero</h1>
<p>Pure pixel-art hero, no raster effects: a robot at a desk presses the tower's power button and the monitor boots — POST rows, a boot logo, then a desktop — all hand-placed pixel rects and stepped frames.</p>

<style>
/* fg:begin palette-classic v1 */
.fg-robot-boot-hero {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 6px;
  --dur-step: 700ms;
  --dur-fast: 0.45s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-hero-in: 900ms;
  --stagger: 80ms;
  --ease-frames: steps(10);
  --ease-frames-coarse: steps(4, jump-none);
  --dur-tick: 100ms;
  --ease-frames-fine: steps(24, jump-none);
  --dur-flicker: 800ms;
}
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-robot-boot-hero {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-robot-boot-hero svg { display: block; width: 100%; height: auto; }
.fg-robot-boot-hero text { font-family: inherit; }
/* fg:end panel-base */
.fg-robot-boot-hero {
  padding: 0; /* heroes are full-bleed inside the panel */
  overflow: hidden;
}
.fg-robot-boot-hero svg { shape-rendering: crispEdges; }

/* --- static scene defaults ------------------------------------------ */
/* Clean-pixel experiment: every shape is a hand-placed 8-unit pixel
   rect; no filters, patterns, or overlay textures anywhere. */
.fg-robot-boot-hero .rbh-pop { opacity: 0; }
.fg-robot-boot-hero .rbh-arm-ext { opacity: 0; }
.fg-robot-boot-hero .rbh-led { opacity: 0; }
.fg-robot-boot-hero .rbh-flash,
.fg-robot-boot-hero .rbh-scene-post,
.fg-robot-boot-hero .rbh-scene-logo,
.fg-robot-boot-hero .rbh-scene-desktop { opacity: 0; }
.fg-robot-boot-hero .rbh-post-row { opacity: 0; }
.fg-robot-boot-hero .rbh-boot-dot { opacity: 0; }
.fg-robot-boot-hero .rbh-fan-b { opacity: 0; }

/* --- intro: master 7s stepped timeline on .is-live ------------------ */
.fg-robot-boot-hero.is-live .rbh-pop {
  animation: fg-rbh-pop 0.4s var(--ease-frames-coarse)
    calc(var(--i) * calc(var(--stagger) * 2)) both;
}
.fg-robot-boot-hero.is-live .rbh-arm-rest {
  animation: fg-rbh-arm-rest 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-arm-ext {
  animation: fg-rbh-arm-ext 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-button {
  animation: fg-rbh-press 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-led {
  animation: fg-rbh-led-on 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-scene-off {
  animation: fg-rbh-sc-off 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-flash {
  animation: fg-rbh-sc-flash 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-scene-post {
  animation: fg-rbh-sc-post 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-post-row {
  animation: fg-rbh-on 0.1s steps(1, jump-end)
    calc(2.5s + var(--i) * 0.3s) both;
}
.fg-robot-boot-hero.is-live .rbh-scene-logo {
  animation: fg-rbh-sc-logo 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-boot-dot {
  animation: fg-rbh-on 0.1s steps(1, jump-end)
    calc(4.7s + var(--i) * 0.15s) both;
}
.fg-robot-boot-hero.is-live .rbh-scene-desktop {
  animation: fg-rbh-sc-desktop 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-head {
  animation: fg-rbh-nod 7s steps(1, jump-end) both;
}
.fg-robot-boot-hero.is-live .rbh-fan-a,
.fg-robot-boot-hero.is-settled .rbh-fan-a {
  animation: fg-rbh-fan-a calc(var(--dur-tick) * 4) steps(2, jump-none) 1.8s infinite;
}
.fg-robot-boot-hero.is-live .rbh-fan-b,
.fg-robot-boot-hero.is-settled .rbh-fan-b {
  animation: fg-rbh-fan-b calc(var(--dur-tick) * 4) steps(2, jump-none) 1.8s infinite;
}

@keyframes fg-rbh-pop { from { opacity: 0; transform: translateY(16px); }
                        to   { opacity: 1; transform: none; } }
@keyframes fg-rbh-on { to { opacity: 1; } }
/* arm swap: press between 1.6s (23%) and 2.2s (31%) */
@keyframes fg-rbh-arm-rest { 0%, 22% { opacity: 1; } 23%, 31% { opacity: 0; } 32%, 100% { opacity: 1; } }
@keyframes fg-rbh-arm-ext  { 0%, 22% { opacity: 0; } 23%, 31% { opacity: 1; } 32%, 100% { opacity: 0; } }
@keyframes fg-rbh-press    { 0%, 24% { transform: none; } 25%, 30% { transform: translateX(6px); } 31%, 100% { transform: none; } }
@keyframes fg-rbh-led-on   { 0%, 25% { opacity: 0; } 26%, 100% { opacity: 1; } }
/* screen flipbook: off -> flash (31-33%) -> post (33-65%) -> logo (65-77%) -> desktop */
@keyframes fg-rbh-sc-off     { 0%, 30% { opacity: 1; } 31%, 100% { opacity: 0; } }
@keyframes fg-rbh-sc-flash   { 0%, 30% { opacity: 0; } 31%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
@keyframes fg-rbh-sc-post    { 0%, 33% { opacity: 0; } 34%, 64% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes fg-rbh-sc-logo    { 0%, 64% { opacity: 0; } 65%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
@keyframes fg-rbh-sc-desktop { 0%, 76% { opacity: 0; } 77%, 100% { opacity: 1; } }
@keyframes fg-rbh-nod { 0%, 76% { transform: none; } 77%, 81% { transform: translateY(8px); } 82%, 100% { transform: none; } }
@keyframes fg-rbh-fan-a { 50% { opacity: 0; } }
@keyframes fg-rbh-fan-b { 50% { opacity: 1; } }

/* --- settled state (complete final composition; the reduced-motion
       rendering) ---------------------------------------------------- */
.fg-robot-boot-hero.is-settled .rbh-pop { opacity: 1; transform: none; }
.fg-robot-boot-hero.is-settled .rbh-arm-rest { opacity: 1; }
.fg-robot-boot-hero.is-settled .rbh-arm-ext { opacity: 0; }
.fg-robot-boot-hero.is-settled .rbh-led { opacity: 1; }
.fg-robot-boot-hero.is-settled .rbh-scene-off,
.fg-robot-boot-hero.is-settled .rbh-flash,
.fg-robot-boot-hero.is-settled .rbh-scene-post,
.fg-robot-boot-hero.is-settled .rbh-scene-logo { opacity: 0; }
.fg-robot-boot-hero.is-settled .rbh-scene-desktop { opacity: 1; }
.fg-robot-boot-hero.is-settled .rbh-post-row,
.fg-robot-boot-hero.is-settled .rbh-boot-dot { opacity: 1; }
.fg-robot-boot-hero.is-settled .rbh-fan-a { opacity: 1; }

/* --- ambient loop (exactly 3: cursor, LED heartbeat, fan flip) ------ */
.fg-robot-boot-hero.is-settled .rbh-cursor {
  animation: fg-rbh-cursor calc(var(--dur-tick) * 10) steps(2, jump-none) infinite;
}
.fg-robot-boot-hero.is-settled .rbh-led {
  animation: fg-rbh-heartbeat calc(var(--dur-tick) * 20) steps(1, jump-end) infinite;
}
.fg-robot-boot-hero.is-paused .rbh-cursor,
.fg-robot-boot-hero.is-paused .rbh-led,
.fg-robot-boot-hero.is-paused .rbh-fan-a,
.fg-robot-boot-hero.is-paused .rbh-fan-b { animation-play-state: paused; }

@keyframes fg-rbh-cursor { 50% { opacity: 0; } }
@keyframes fg-rbh-heartbeat { 0%, 85% { opacity: 1; } 86%, 92% { opacity: 0.3; } 93%, 100% { opacity: 1; } }

/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-robot-boot-hero, .fg-robot-boot-hero * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */
</style>

<script>
(() => {
  const INTRO_MS = 7000; // press 1.6s, POST 2.3-4.5s, logo 4.5-5.4s, desktop 5.4s

  // fg:begin hero-start v1
  const root = document.currentScript.closest('.fg-diagram');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    root.classList.add('is-settled'); // final composition, no motion
  } else {
    let started = false;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!started) {
        if (!e.isIntersecting) return;
        started = true; // intro plays once per page load
        root.classList.add('is-live');
        setTimeout(() => root.classList.add('is-settled'), INTRO_MS);
      } else {
        root.classList.toggle('is-paused', !e.isIntersecting);
      }
    }), { threshold: 0.3 });
    io.observe(root);
  }
  // fg:end hero-start
})();
</script>
