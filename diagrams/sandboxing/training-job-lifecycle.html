<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The per-job training sandbox lifecycle</title>
<link rel="stylesheet" href="../../shared/preview.css">
</head>
<body>
<h1>The per-job training sandbox lifecycle</h1>
<p>Step through one training job: compose run creates the container, mounts attach, the job runs against the GPU, checkpoints land on the data root, and the container is removed while the data mounts persist.</p>

<!-- fg:embed-start -->
<div class="fg-diagram fg-training-job-lifecycle">
<style>
/* fg:begin palette-classic v1 */
.fg-training-job-lifecycle {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --dur-quick: 0.3s;
  --dur-fast: 0.45s;
  --dur-slow: 0.7s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
:where(.fg-training-job-lifecycle .fg-fill-accent) { fill: var(--accent); }
:where(.fg-training-job-lifecycle .fg-stroke-accent) { stroke: var(--accent); }
:where(.fg-training-job-lifecycle .fg-fill-ok) { fill: var(--ok); }
:where(.fg-training-job-lifecycle .fg-stroke-ok) { stroke: var(--ok); }
:where(.fg-training-job-lifecycle .fg-fill-warn) { fill: var(--warn); }
:where(.fg-training-job-lifecycle .fg-stroke-warn) { stroke: var(--warn); }
:where(.fg-training-job-lifecycle .fg-fill-hot) { fill: var(--hot); }
:where(.fg-training-job-lifecycle .fg-stroke-hot) { stroke: var(--hot); }
:where(.fg-training-job-lifecycle .fg-fill-violet) { fill: var(--violet); }
:where(.fg-training-job-lifecycle .fg-stroke-violet) { stroke: var(--violet); }
:where(.fg-training-job-lifecycle .fg-fill-line) { fill: var(--line); }
:where(.fg-training-job-lifecycle .fg-stroke-line) { stroke: var(--line); }
:where(.fg-training-job-lifecycle .fg-fill-border) { fill: var(--border); }
:where(.fg-training-job-lifecycle .fg-stroke-border) { stroke: var(--border); }
:where(.fg-training-job-lifecycle .fg-fill-text) { fill: var(--text); }
:where(.fg-training-job-lifecycle .fg-stroke-text) { stroke: var(--text); }
:where(.fg-training-job-lifecycle .fg-fill-muted) { fill: var(--muted); }
:where(.fg-training-job-lifecycle .fg-stroke-muted) { stroke: var(--muted); }
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-training-job-lifecycle {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-training-job-lifecycle svg { display: block; width: 100%; height: auto; }
.fg-training-job-lifecycle text { font-family: inherit; }
/* fg:end panel-base */
.fg-training-job-lifecycle {
  padding: 16px 16px 12px;
}


.fg-training-job-lifecycle .tjl-box {
  fill: var(--panel); stroke: var(--border); stroke-width: 1.5;
  transition: fill var(--dur-fast) var(--ease), stroke var(--dur-fast), opacity var(--dur-fast);
}
.fg-training-job-lifecycle .tjl-title { fill: var(--muted); font-size: 13px; font-weight: 600; text-anchor: middle; transition: fill var(--dur-fast); }
.fg-training-job-lifecycle .tjl-sub { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); text-anchor: middle; opacity: 0.75; transition: fill var(--dur-fast), opacity var(--dur-fast); }
.fg-training-job-lifecycle .tjl-label { fill: var(--muted); font-size: 12px; }
.fg-training-job-lifecycle .tjl-mount {
  stroke: var(--line); stroke-width: 2; fill: none; opacity: 0.35;
  transition: stroke var(--dur-fast), opacity var(--dur-fast);
}
.fg-training-job-lifecycle .tjl-mount-label { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); opacity: 0.5; transition: fill var(--dur-fast), opacity var(--dur-fast); }

/* the container itself: appears at step 1, hardens at 2, active 3-4, gone at 5 */
.fg-training-job-lifecycle .tjl-container { opacity: 0.25; transition: opacity var(--dur-fast); }
.fg-training-job-lifecycle.is-step-1 .tjl-container, .fg-training-job-lifecycle.is-step-2 .tjl-container,
.fg-training-job-lifecycle.is-step-3 .tjl-container, .fg-training-job-lifecycle.is-step-4 .tjl-container
  { opacity: 1; }
.fg-training-job-lifecycle.is-step-5 .tjl-container { opacity: 0.12; }

.fg-training-job-lifecycle.is-step-1 .tjl-s1 .tjl-box { fill: var(--accent-dim); stroke: var(--accent); }
.fg-training-job-lifecycle.is-step-2 .tjl-s2 .tjl-box { fill: var(--accent-dim); stroke: var(--accent); }
.fg-training-job-lifecycle.is-step-3 .tjl-s3 .tjl-box { fill: var(--accent-dim); stroke: var(--accent); }
.fg-training-job-lifecycle.is-step-4 .tjl-s4 .tjl-box { fill: var(--ok-dim); stroke: var(--ok); }
.fg-training-job-lifecycle.is-step-1 .tjl-s1 .tjl-title, .fg-training-job-lifecycle.is-step-2 .tjl-s2 .tjl-title,
.fg-training-job-lifecycle.is-step-3 .tjl-s3 .tjl-title, .fg-training-job-lifecycle.is-step-4 .tjl-s4 .tjl-title
  { fill: var(--text); }

/* the GPU is held while the job runs (steps 3-4) and released at removal */
.fg-training-job-lifecycle.is-step-3 .tjl-gpu .tjl-box, .fg-training-job-lifecycle.is-step-4 .tjl-gpu .tjl-box
  { fill: var(--accent-dim); stroke: var(--accent); }
.fg-training-job-lifecycle.is-step-3 .tjl-gpu .tjl-title, .fg-training-job-lifecycle.is-step-4 .tjl-gpu .tjl-title
  { fill: var(--text); }

/* draw-in: mount connectors draw themselves at step 2, staggered per mount */
.fg-training-job-lifecycle .tjl-draw {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset calc(var(--dur-slow) * 1.3) var(--ease) var(--d, 0s), stroke var(--dur-fast), opacity var(--dur-fast);
}
.fg-training-job-lifecycle.is-step-2 .tjl-draw, .fg-training-job-lifecycle.is-step-3 .tjl-draw,
.fg-training-job-lifecycle.is-step-4 .tjl-draw, .fg-training-job-lifecycle.is-step-5 .tjl-draw
  { stroke-dashoffset: 0; }

/* mounts light up at step 2+ */
.fg-training-job-lifecycle.is-step-2 .tjl-mount, .fg-training-job-lifecycle.is-step-3 .tjl-mount,
.fg-training-job-lifecycle.is-step-4 .tjl-mount { opacity: 1; stroke: var(--accent); }
.fg-training-job-lifecycle.is-step-2 .tjl-mount-label, .fg-training-job-lifecycle.is-step-3 .tjl-mount-label,
.fg-training-job-lifecycle.is-step-4 .tjl-mount-label, .fg-training-job-lifecycle.is-step-5 .tjl-mount-label
  { opacity: 1; fill: var(--text); }

/* checkpoint write path lights at step 4 */
.fg-training-job-lifecycle .tjl-ckpt { stroke: var(--line); stroke-width: 2.5; fill: none; opacity: 0.3; transition: stroke var(--dur-fast), opacity var(--dur-fast); }
.fg-training-job-lifecycle.is-step-4 .tjl-ckpt { stroke: var(--ok); opacity: 1; stroke-dasharray: 5 4; animation: fg-tjl-flow 1.2s linear infinite; }
@keyframes fg-tjl-flow { to { stroke-dashoffset: -18; } }

/* step-4 comet along the checkpoint path (kicked from the fg:step handler) */
.fg-training-job-lifecycle .tjl-comet { display: none; }
.fg-training-job-lifecycle.is-step-4 .tjl-comet { display: inline; }

/* step-5 payoff: the persistent stores glow while the container evaporates.
   Glow pattern: halo rects are blurred once, statically; only opacity animates. */
.fg-training-job-lifecycle .tjl-halo {
  filter: blur(6px); fill: var(--ok); opacity: 0; pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease);
}
.fg-training-job-lifecycle.is-step-5 .tjl-halo { opacity: 0.4; }
.fg-training-job-lifecycle.is-step-5 .tjl-persist .tjl-box { stroke: var(--ok); }
.fg-training-job-lifecycle.is-step-5 .tjl-persist .tjl-title { fill: var(--text); }

/* fg:begin caption-box v1 */
.fg-training-job-lifecycle .fg-caption {
  margin-top: 12px; padding: 10px 14px;
  background: var(--panel); border-left: 3px solid var(--fg-cap-accent, var(--accent));
  border-radius: 0 8px 8px 0;
  /* min-height reserves space for the longest caption: no page reflow */
  color: var(--text); font-size: 13px; min-height: var(--fg-cap-minh, 4.2em);
}
.fg-training-job-lifecycle .fg-caption.fg-cap-grid { display: grid; }
.fg-training-job-lifecycle .fg-cap-ghost { grid-area: 1 / 1; visibility: hidden; }
.fg-training-job-lifecycle .fg-cap-live { grid-area: 1 / 1; }
.fg-training-job-lifecycle [data-info]:focus { outline: none; }
.fg-training-job-lifecycle [data-info]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* fg:end caption-box */
.fg-training-job-lifecycle .fg-caption { color: var(--muted); transition: color var(--dur-fast) var(--ease); }
.fg-training-job-lifecycle .fg-caption.is-active { color: var(--text); }
.fg-training-job-lifecycle .fg-caption strong { color: var(--accent); font-weight: 600; }
.fg-training-job-lifecycle .fg-caption code {
  font-family: var(--mono); font-size: 12px; color: var(--warn);
  background: rgba(0, 0, 0, 0.3); padding: 1px 5px; border-radius: 4px;
}

/* fg:begin controls-bar v1 */
.fg-training-job-lifecycle .fg-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.fg-training-job-lifecycle .fg-controls button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; width: 34px; height: 28px; font-size: 13px;
  cursor: pointer; padding: 0; line-height: 1;
}
.fg-training-job-lifecycle .fg-controls button:hover { border-color: var(--fg-ctl-accent, var(--accent)); }
.fg-training-job-lifecycle .fg-controls [data-fg="counter"] {
  color: var(--muted); font-size: 12px; margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
/* fg:end controls-bar */

/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-training-job-lifecycle, .fg-training-job-lifecycle * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */
@media (prefers-reduced-motion: reduce) {
  .fg-training-job-lifecycle .tjl-comet { display: none !important; } /* SMIL ignores reduced motion */
}
</style>

<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Lifecycle of one training job: docker compose run creates an ephemeral hardened container; the model, recipe, and code mounts attach read-only alongside the writable training root and a narrow read-write window for exported GGUFs; the job trains against the reserved GPU; checkpoints stream to the training root; the container is removed and the GPU released while the data mounts persist.">
  <defs>
    <marker id="tjl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="fg-fill-line" d="M 0 1 L 10 5 L 0 9 z"/>
    </marker>
    <marker id="tjl-arrow-ok" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="fg-fill-ok" d="M 0 1 L 10 5 L 0 9 z"/>
    </marker>
  </defs>

  <g class="tjl-stage tjl-s1">
    <rect class="tjl-box" x="20" y="24" width="300" height="56" rx="8"/>
    <text class="tjl-title" x="170" y="48">docker compose run --rm training</text>
    <text class="tjl-sub" x="170" y="66">separate compose file · make train-*</text>
  </g>
  <path class="tjl-mount" d="M 170 80 L 170 116" marker-end="url(#tjl-arrow)"/>

  <g class="tjl-container">
    <g class="tjl-stage tjl-s2">
      <rect class="tjl-box" x="20" y="120" width="440" height="140" rx="10"/>
      <text class="tjl-title" x="240" y="146">training container (ephemeral)</text>
      <text class="tjl-sub" x="240" y="164">cap_drop ALL · no-new-privileges · read_only · non-root</text>
      <text class="tjl-sub" x="240" y="180">no port · no healthcheck · no restart policy</text>
    </g>
    <g class="tjl-stage tjl-s3">
      <rect class="tjl-box" x="48" y="192" width="384" height="52" rx="8"/>
      <text class="tjl-title" x="240" y="214">job: fine-tune / pretrain recipe</text>
      <text class="tjl-sub" x="240" y="232">tmpfs /tmp (exec) for CUDA JIT · shm 16g for dataloaders</text>
    </g>
  </g>

  <g class="tjl-stage tjl-gpu">
    <rect class="tjl-box" x="520" y="140" width="180" height="56" rx="8"/>
    <text class="tjl-title" x="610" y="164">RTX 5090</text>
    <text class="tjl-sub" x="610" y="182">1 GPU · sole consumer</text>
  </g>
  <path class="tjl-mount tjl-draw" pathLength="1" d="M 460 176 L 516 172" marker-end="url(#tjl-arrow)"/>

  <g class="tjl-stage tjl-s2b">
    <rect class="tjl-box" x="20" y="296" width="160" height="56" rx="8"/>
    <text class="tjl-title" x="100" y="318">/mnt/ai-data/models</text>
    <text class="tjl-sub" x="100" y="336">:ro — weights in</text>
  </g>
  <g class="tjl-stage tjl-s4 tjl-persist">
    <rect class="tjl-halo" x="196" y="296" width="170" height="56" rx="8"/>
    <rect class="tjl-box" x="196" y="296" width="170" height="56" rx="8"/>
    <text class="tjl-title" x="281" y="318">/mnt/ai-data/training</text>
    <text class="tjl-sub" x="281" y="336">rw — checkpoints out</text>
  </g>
  <g class="tjl-stage tjl-persist">
    <rect class="tjl-halo" x="382" y="296" width="160" height="56" rx="8"/>
    <rect class="tjl-box" x="382" y="296" width="160" height="56" rx="8"/>
    <text class="tjl-title" x="462" y="318">models/trained</text>
    <text class="tjl-sub" x="462" y="336">rw — exported GGUFs</text>
  </g>
  <g class="tjl-stage tjl-s2c">
    <rect class="tjl-box" x="558" y="296" width="142" height="56" rx="8"/>
    <text class="tjl-title" x="629" y="318">repo sources</text>
    <text class="tjl-sub" x="629" y="336">:ro — recipes, code in</text>
  </g>

  <path class="tjl-mount tjl-draw" pathLength="1" d="M 100 292 L 100 264"/>
  <text class="tjl-mount-label" x="62" y="282">ro</text>
  <path id="tjl-ckpt-route" class="tjl-ckpt tjl-draw" pathLength="1" style="--d: 0.15s" d="M 281 260 L 281 292" marker-end="url(#tjl-arrow-ok)"/>
  <text class="tjl-mount-label" x="292" y="280">rw</text>
  <path class="tjl-mount tjl-draw" pathLength="1" style="--d: 0.3s" d="M 420 260 L 456 292"/>
  <text class="tjl-mount-label" x="448" y="278">rw</text>
  <path class="tjl-mount tjl-draw" pathLength="1" style="--d: 0.45s" d="M 629 292 L 456 250"/>
  <text class="tjl-mount-label" x="540" y="280">ro</text>

  <g class="tjl-comet">
    <circle class="tjl-comet-head fg-fill-ok" r="5">
      <animateMotion id="tjl-comet-run" dur="1.2s" begin="indefinite" repeatCount="2"><mpath href="#tjl-ckpt-route"/></animateMotion>
    </circle>
    <circle class="fg-fill-ok" r="3.5" opacity="0.5">
      <animateMotion dur="1.2s" begin="tjl-comet-run.begin+0.1s" repeatCount="2"><mpath href="#tjl-ckpt-route"/></animateMotion>
    </circle>
    <circle class="fg-fill-ok" r="2.5" opacity="0.3">
      <animateMotion dur="1.2s" begin="tjl-comet-run.begin+0.2s" repeatCount="2"><mpath href="#tjl-ckpt-route"/></animateMotion>
    </circle>
  </g>

  <text class="tjl-label" x="20" y="388">the container is disposable; only the data mounts persist</text>
</svg>

<div class="fg-caption" data-fg="caption">Press play or step through one training job.</div>

<div class="fg-controls">
  <button data-fg="prev" aria-label="Previous step">‹</button>
  <button data-fg="play" aria-label="Play or pause">▶</button>
  <button data-fg="next" aria-label="Next step">›</button>
  <span data-fg="counter"></span>
</div>

<script>(() => {
  const root = document.currentScript.closest('.fg-diagram');
  const TOTAL = 5, STEP_MS = 2800;

  const CAPTIONS = [
    'Press play or step through one training job.',
    ['Invoke', 'docker compose run --rm training <command> — a fresh container per job, from a separate compose file that make up never touches. There is no daemon to keep patched and no port to expose.'],
    ['Attach mounts', 'The hardened container comes up read-only and non-root, with cap_drop ALL. Models, recipes, and code mount read-only; the training data root mounts read-write, plus one narrow window — models/trained — where exported GGUFs land.'],
    ['Run the job', 'The recipe trains against the reserved GPU — the sole consumer while it holds the card. tmpfs /tmp with the exec flag carries the CUDA and Triton JIT caches that a read-only rootfs would block; 16GB shm feeds the dataloader workers.'],
    ['Write checkpoints', 'Checkpoints, shards, and run outputs stream to /mnt/ai-data/training, the writable data root. Nothing the job writes outside the data mounts can outlive it.'],
    ['Remove', 'The job exits, --rm deletes the container, and the GPU is released. The artifacts on the data mounts — checkpoints on the training root, exported GGUFs under models/trained — are the only trace the job ever ran.'],
  ];

  // fg:begin timeline-core v1
  let step = 0, timer = null, held = false; // held: the reader paused; autoplay stays off
  function apply() {
    for (let i = 0; i <= TOTAL; i++) root.classList.remove('is-step-' + i);
    root.classList.add('is-step-' + step);
    root.dispatchEvent(new CustomEvent('fg:step', { detail: { step } }));
  }
  const tl = {
    get step() { return step; },
    get playing() { return timer !== null; },
    go(n) { step = ((n % (TOTAL + 1)) + TOTAL + 1) % (TOTAL + 1); apply(); },
    next() { tl.go(step + 1); },
    prev() { tl.go(step - 1); },
    play() { if (!timer) { timer = setInterval(() => tl.next(), STEP_MS); root.classList.add('is-playing'); } },
    pause() { clearInterval(timer); timer = null; root.classList.remove('is-playing'); },
  };
  const btn = (name) => root.querySelector('[data-fg="' + name + '"]');
  btn('prev').addEventListener('click', () => { held = true; tl.pause(); tl.prev(); });
  btn('next').addEventListener('click', () => { held = true; tl.pause(); tl.next(); });
  btn('play').addEventListener('click', () => { held = tl.playing; held ? tl.pause() : tl.play(); });
  const counter = btn('counter');
  function sync() {
    if (counter) counter.textContent = tl.step + ' / ' + TOTAL;
    btn('play').textContent = tl.playing ? '❚❚' : '▶';
  }
  root.addEventListener('fg:step', sync);
  root.querySelectorAll('.fg-controls button').forEach((b) => b.addEventListener('click', sync));
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // fg:end timeline-core

  // step-triggered comet: kick only the head; trails chain via syncbase timing
  root.addEventListener('fg:step', (e) => {
    if (e.detail.step === 4 && !reduced) {
      root.querySelectorAll('.tjl-comet-head animateMotion').forEach((m) => m.beginElement());
    }
  });

  // fg:begin caption-core v1
  // Captions change at runtime. Every variant is stacked invisibly in one
  // grid cell, so the box takes the tallest variant's height at any column
  // width and changing the caption never reflows the post.
  const caption = root.querySelector('[data-fg="caption"]');
  const captionInitial = caption ? caption.innerHTML : '';
  const captionText = document.createElement('span');
  function reserveCaption(variants) {
    if (!caption) return;
    caption.textContent = '';
    caption.classList.add('fg-cap-grid');
    for (const html of [captionInitial, ...variants]) {
      const ghost = document.createElement('span');
      ghost.className = 'fg-cap-ghost';
      ghost.setAttribute('aria-hidden', 'true');
      ghost.innerHTML = html;
      caption.appendChild(ghost);
    }
    captionText.className = 'fg-cap-live';
    captionText.setAttribute('aria-live', 'polite');
    captionText.innerHTML = captionInitial;
    caption.appendChild(captionText);
  }
  function setCaption(html) { captionText.innerHTML = html; }
  function escHtml(t) { const s = document.createElement('span'); s.textContent = t; return s.innerHTML; }
  // fg:end caption-core
  // fg:begin step-caption v1
  // CAPTIONS[step] is plain text, or [title, text] shown as "N. title — text"
  // with the caption marked active.
  function stepCaptionHtml(s) {
    const c = CAPTIONS[s];
    return Array.isArray(c) ? '<strong>' + escHtml(s + '. ' + c[0]) + '</strong> \u2014 ' + escHtml(c[1]) : escHtml(c);
  }
  reserveCaption(CAPTIONS.map((c, s) => stepCaptionHtml(s)));
  root.addEventListener('fg:step', (e) => {
    setCaption(stepCaptionHtml(e.detail.step));
    if (caption) caption.classList.toggle('is-active', Array.isArray(CAPTIONS[e.detail.step]));
  });
  // fg:end step-caption

  // fg:begin timeline-start v1
  apply();
  if (reduced) {
    tl.go(TOTAL); // show final state, manual stepping still available
  } else {
    const io = new IntersectionObserver(
      // The first callback reports any overlap as intersecting, so test the
      // ratio; a reader who paused keeps control until they press play.
      (entries) => entries.forEach((e) => {
        if (e.intersectionRatio < 0.3) tl.pause();
        else if (!held) tl.play();
      }),
      { threshold: 0.3 }
    );
    io.observe(root);
  }
  // fg:end timeline-start
})();</script>
</div>
<!-- fg:embed-end -->
</body>
</html>
