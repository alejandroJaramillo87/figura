<body>
<h1>Attention &amp; KV cache — hero</h1>
<p>Abstract raster hero: a pixel stream, staircase arcs, a dither field, and a comet-swept cache run — frame-ticked like an encoded GIF.</p>

<!-- fg:embed-start -->
<div class="fg-diagram fg-attention-hero">
<style>
/* fg:begin palette-classic v1 */
.fg-attention-hero {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 6px;
  --dur-step: 700ms;
  --dur-fast: 0.45s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-hero-in: 900ms;
  --stagger: 80ms;
  --ease-frames: steps(10);
  --ease-frames-coarse: steps(4, jump-none);
  --dur-tick: 100ms;
}
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-attention-hero {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-attention-hero svg { display: block; width: 100%; height: auto; }
.fg-attention-hero text { font-family: inherit; }
/* fg:end panel-base */
.fg-attention-hero {
  padding: 0; /* heroes are full-bleed inside the panel */
  overflow: hidden;
}
.fg-attention-hero svg { shape-rendering: crispEdges; }

/* --- static scene (all geometry on the 4-unit pixel grid) ----------- */
.fg-attention-hero .ath-tok { opacity: 0; }
.fg-attention-hero .ath-m { opacity: 0; }
.fg-attention-hero .ath-kv { fill: var(--panel); stroke: var(--border); opacity: 0; }
.fg-attention-hero .ath-arc { fill: none; stroke-width: 3; opacity: 0.7;
  stroke-dasharray: 1; stroke-dashoffset: 1; }
.fg-attention-hero .ath-arc-a { stroke: var(--accent); }
.fg-attention-hero .ath-arc-v { stroke: var(--violet); }
.fg-attention-hero .ath-halo-px { opacity: 0; }
.fg-attention-hero .ath-comet { fill: var(--accent); opacity: 0;
  offset-path: path('M 512 104 H 1124'); offset-rotate: 0deg; }
.fg-attention-hero .ath-flow { fill: none; stroke: var(--line); stroke-width: 4;
  stroke-dasharray: 8 8; opacity: 0; }
.fg-attention-hero .ath-orbit { fill: var(--violet); opacity: 0;
  transform-box: fill-box; transform-origin: center; }

/* --- intro (fires on .is-live; frame-quantized, staggered via --i) -- */
.fg-attention-hero.is-live .ath-tok {
  animation: fg-ath-pop 0.5s var(--ease-frames-coarse)
    calc(var(--i) * var(--stagger)) both;
}
.fg-attention-hero.is-live .ath-m {
  animation: fg-ath-on 0.3s var(--ease-frames-coarse) calc(0.5s + var(--i) * var(--stagger)) both;
}
.fg-attention-hero.is-live .ath-kv {
  animation:
    fg-ath-pop 0.5s var(--ease-frames-coarse) calc(0.6s + var(--i) * var(--stagger)) both,
    fg-ath-fill 0.2s steps(1, jump-end) calc(3.5s + var(--i) * 0.12s) forwards;
}
.fg-attention-hero.is-live .ath-arc {
  animation: fg-ath-draw 0.9s var(--ease-frames) calc(1.2s + var(--i) * 0.18s) both;
}
.fg-attention-hero.is-live .ath-comet {
  animation: fg-ath-comet 1.8s steps(24, jump-none) 3.4s both;
}
.fg-attention-hero.is-live .ath-c2 { animation-delay: 3.5s; }
.fg-attention-hero.is-live .ath-c3 { animation-delay: 3.58s; }
.fg-attention-hero.is-live .ath-halo-px {
  animation: fg-ath-bloom 1s var(--ease-frames-coarse) 4.6s both;
}
.fg-attention-hero.is-live .ath-flow {
  animation: fg-ath-on-half 0.4s var(--ease-frames-coarse) 5.8s both;
}
.fg-attention-hero.is-live .ath-orbit {
  animation: fg-ath-on-half 0.4s var(--ease-frames-coarse) 6s both;
}

@keyframes fg-ath-pop {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}
@keyframes fg-ath-on { from { opacity: 0; } to { opacity: 1; } }
@keyframes fg-ath-on-half { from { opacity: 0; } to { opacity: 0.5; } }
@keyframes fg-ath-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fg-ath-fill { to { fill: var(--ok-dim); stroke: var(--ok); } }
@keyframes fg-ath-comet {
  0%   { offset-distance: 0%; opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes fg-ath-bloom {
  0% { opacity: 0; } 50% { opacity: 0.5; } 100% { opacity: 0.2; }
}

/* --- settled state (complete final composition; the reduced-motion
       rendering) ---------------------------------------------------- */
.fg-attention-hero.is-settled .ath-tok { opacity: 1; transform: none; }
.fg-attention-hero.is-settled .ath-m { opacity: 1; }
.fg-attention-hero.is-settled .ath-kv { opacity: 1; transform: none;
  fill: var(--ok-dim); stroke: var(--ok); }
.fg-attention-hero.is-settled .ath-arc { stroke-dashoffset: 0; }
.fg-attention-hero.is-settled .ath-halo-px { opacity: 0.2; }
.fg-attention-hero.is-settled .ath-flow { opacity: 0.5; }
.fg-attention-hero.is-settled .ath-orbit { opacity: 0.5; }

/* --- ambient loop (≤3 concurrent; frame-ticked; gated on settle) ---- */
.fg-attention-hero.is-settled .ath-flow {
  animation: fg-ath-hop calc(var(--dur-tick) * 8) steps(8) infinite;
}
.fg-attention-hero.is-settled .ath-halo-px {
  animation: fg-ath-blink calc(var(--dur-tick) * 8) steps(2, jump-none) infinite;
}
.fg-attention-hero.is-settled .ath-orbit {
  animation: fg-ath-orbit 12s steps(12) infinite;
}
.fg-attention-hero.is-paused .ath-flow,
.fg-attention-hero.is-paused .ath-halo-px,
.fg-attention-hero.is-paused .ath-orbit { animation-play-state: paused; }

@keyframes fg-ath-hop { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
@keyframes fg-ath-blink { 50% { opacity: 0.35; } }
@keyframes fg-ath-orbit {
  from { transform: rotate(0turn) translateX(124px); }
  to   { transform: rotate(1turn) translateX(124px); }
}

/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-attention-hero, .fg-attention-hero * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */
</style>

<script>
(() => {
  const INTRO_MS = 7000; // cell snaps end ~5.1s, bloom ~5.6s, fades ~6.4s

  // fg:begin hero-start v1
  const root = document.currentScript.closest('.fg-diagram');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    root.classList.add('is-settled'); // final composition, no motion
  } else {
    let started = false;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!started) {
        if (!e.isIntersecting) return;
        started = true; // intro plays once per page load
        root.classList.add('is-live');
        setTimeout(() => root.classList.add('is-settled'), INTRO_MS);
      } else {
        root.classList.toggle('is-paused', !e.isIntersecting);
      }
    }), { threshold: 0.3 });
    io.observe(root);
  }
  // fg:end hero-start
})();
</script>
