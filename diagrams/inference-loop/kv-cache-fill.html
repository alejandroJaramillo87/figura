<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV cache fill during the decode loop</title>
<link rel="stylesheet" href="../../shared/preview.css">
</head>
<body>
<h1>KV cache fill during the decode loop</h1>
<p>Prefill writes K/V for the whole prompt in one pass; each decode step appends exactly one row and attends over everything cached so far.</p>

<!-- fg:embed-start -->
<div class="fg-diagram fg-kv-cache-fill">
<style>
/* fg:begin palette-classic v1 */
.fg-kv-cache-fill {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --hot: #f87171;
  --violet: #a78bfa;
  --accent-dim: #0c3550;
  --ok-dim: #0e4429;
  --warn-dim: #4a3608;
  --hot-dim: #4a1d1d;
  --violet-dim: #2a2350;
  --line: #64748b;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --dur-quick: 0.3s;
  --dur-fast: 0.45s;
  --dur-slow: 0.7s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
:where(.fg-kv-cache-fill .fg-fill-accent) { fill: var(--accent); }
:where(.fg-kv-cache-fill .fg-stroke-accent) { stroke: var(--accent); }
:where(.fg-kv-cache-fill .fg-fill-ok) { fill: var(--ok); }
:where(.fg-kv-cache-fill .fg-stroke-ok) { stroke: var(--ok); }
:where(.fg-kv-cache-fill .fg-fill-warn) { fill: var(--warn); }
:where(.fg-kv-cache-fill .fg-stroke-warn) { stroke: var(--warn); }
:where(.fg-kv-cache-fill .fg-fill-hot) { fill: var(--hot); }
:where(.fg-kv-cache-fill .fg-stroke-hot) { stroke: var(--hot); }
:where(.fg-kv-cache-fill .fg-fill-violet) { fill: var(--violet); }
:where(.fg-kv-cache-fill .fg-stroke-violet) { stroke: var(--violet); }
:where(.fg-kv-cache-fill .fg-fill-line) { fill: var(--line); }
:where(.fg-kv-cache-fill .fg-stroke-line) { stroke: var(--line); }
:where(.fg-kv-cache-fill .fg-fill-border) { fill: var(--border); }
:where(.fg-kv-cache-fill .fg-stroke-border) { stroke: var(--border); }
:where(.fg-kv-cache-fill .fg-fill-text) { fill: var(--text); }
:where(.fg-kv-cache-fill .fg-stroke-text) { stroke: var(--text); }
:where(.fg-kv-cache-fill .fg-fill-muted) { fill: var(--muted); }
:where(.fg-kv-cache-fill .fg-stroke-muted) { stroke: var(--muted); }
/* fg:end palette-classic */
/* fg:begin panel-base v1 */
.fg-kv-cache-fill {
  background: var(--bg);
  border-radius: var(--radius);
  font-family: var(--font);
  line-height: 1.4;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.fg-kv-cache-fill svg { display: block; width: 100%; height: auto; }
.fg-kv-cache-fill text { font-family: inherit; }
/* fg:end panel-base */
.fg-kv-cache-fill {
  padding: 16px 16px 12px;
}


/* --- static styling ------------------------------------------------ */
.fg-kv-cache-fill .kvcf-label { fill: var(--text); font-size: 15px; font-weight: 600; }
.fg-kv-cache-fill .kvcf-sub   { fill: var(--muted); font-size: 12px; }
.fg-kv-cache-fill .kvcf-mono { font-family: var(--mono); }
.fg-kv-cache-fill .kvcf-cell  {
  fill: var(--panel); stroke: var(--border); stroke-width: 1.5;
  transition: fill var(--dur-fast) var(--ease), stroke var(--dur-fast);
}
.fg-kv-cache-fill .kvcf-tok {
  fill: var(--panel); stroke: var(--border); stroke-width: 1.5;
  transition: fill var(--dur-fast), stroke var(--dur-fast);
}
.fg-kv-cache-fill .kvcf-tok-t { fill: var(--muted); font-size: 13px; text-anchor: middle; transition: fill var(--dur-fast); }
.fg-kv-cache-fill .kvcf-arrow { stroke: var(--line); stroke-width: 2; fill: none; opacity: 0; transition: opacity var(--dur-fast); }
.fg-kv-cache-fill .kvcf-read  { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 5 4; opacity: 0; transition: opacity var(--dur-fast); }

/* --- step states ---------------------------------------------------
   Step 0: empty cache, prompt waiting.
   Step 1: prefill — all 4 prompt rows fill at once.
   Steps 2-4: decode — one generated token appended per step,
              attention reads over every filled row. */
.fg-kv-cache-fill[class*="is-step-"] .kvcf-phase { transition: opacity var(--dur-fast); }

.fg-kv-cache-fill.is-step-1 .kvcf-row-p .kvcf-cell,
.fg-kv-cache-fill.is-step-2 .kvcf-row-p .kvcf-cell,
.fg-kv-cache-fill.is-step-3 .kvcf-row-p .kvcf-cell,
.fg-kv-cache-fill.is-step-4 .kvcf-row-p .kvcf-cell { fill: var(--ok-dim); stroke: var(--ok); }

.fg-kv-cache-fill.is-step-2 .kvcf-row-d0 .kvcf-cell,
.fg-kv-cache-fill.is-step-3 .kvcf-row-d0 .kvcf-cell,
.fg-kv-cache-fill.is-step-4 .kvcf-row-d0 .kvcf-cell { fill: var(--warn-dim); stroke: var(--warn); }
.fg-kv-cache-fill.is-step-3 .kvcf-row-d1 .kvcf-cell,
.fg-kv-cache-fill.is-step-4 .kvcf-row-d1 .kvcf-cell { fill: var(--warn-dim); stroke: var(--warn); }
.fg-kv-cache-fill.is-step-4 .kvcf-row-d2 .kvcf-cell { fill: var(--warn-dim); stroke: var(--warn); }

.fg-kv-cache-fill.is-step-1 .kvcf-tok-p { stroke: var(--ok); }
.fg-kv-cache-fill.is-step-1 .kvcf-tok-p + .kvcf-tok-t { fill: var(--text); }
.fg-kv-cache-fill.is-step-2 .kvcf-tok-g0,
.fg-kv-cache-fill.is-step-3 .kvcf-tok-g0,
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g0 { stroke: var(--warn); }
.fg-kv-cache-fill.is-step-3 .kvcf-tok-g1,
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g1 { stroke: var(--warn); }
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g2 { stroke: var(--warn); }
.fg-kv-cache-fill.is-step-2 .kvcf-tok-g0 + .kvcf-tok-t,
.fg-kv-cache-fill.is-step-3 .kvcf-tok-g0 + .kvcf-tok-t,
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g0 + .kvcf-tok-t,
.fg-kv-cache-fill.is-step-3 .kvcf-tok-g1 + .kvcf-tok-t,
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g1 + .kvcf-tok-t,
.fg-kv-cache-fill.is-step-4 .kvcf-tok-g2 + .kvcf-tok-t { fill: var(--text); }

.fg-kv-cache-fill.is-step-1 .kvcf-arrow-prefill { opacity: 1; }
.fg-kv-cache-fill.is-step-2 .kvcf-arrow-d0,
.fg-kv-cache-fill.is-step-3 .kvcf-arrow-d1,
.fg-kv-cache-fill.is-step-4 .kvcf-arrow-d2 { opacity: 1; }
.fg-kv-cache-fill.is-step-2 .kvcf-read,
.fg-kv-cache-fill.is-step-3 .kvcf-read,
.fg-kv-cache-fill.is-step-4 .kvcf-read { opacity: 1; }

/* phase captions */
.fg-kv-cache-fill .kvcf-phase { opacity: 0; }
.fg-kv-cache-fill.is-step-0 .kvcf-phase-idle,
.fg-kv-cache-fill.is-step-1 .kvcf-phase-prefill,
.fg-kv-cache-fill.is-step-2 .kvcf-phase-decode,
.fg-kv-cache-fill.is-step-3 .kvcf-phase-decode,
.fg-kv-cache-fill.is-step-4 .kvcf-phase-decode { opacity: 1; }

/* --- controls ------------------------------------------------------ */
/* fg:begin controls-bar v1 */
.fg-kv-cache-fill .fg-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.fg-kv-cache-fill .fg-controls button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; width: 34px; height: 28px; font-size: 13px;
  cursor: pointer; padding: 0; line-height: 1;
}
.fg-kv-cache-fill .fg-controls button:hover { border-color: var(--fg-ctl-accent, var(--accent)); }
.fg-kv-cache-fill .fg-controls [data-fg="counter"] {
  color: var(--muted); font-size: 12px; margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
/* fg:end controls-bar */
/* fg:begin reduced-motion v1 */
@media (prefers-reduced-motion: reduce) {
  .fg-kv-cache-fill, .fg-kv-cache-fill * { transition: none !important; animation: none !important; }
}
/* fg:end reduced-motion */

<div class="fg-controls">

  <button type="button" data-fg="play" aria-label="Play or pause" aria-pressed="false">&#9654;&#xFE0E;</button>
  <button type="button" data-fg="next" aria-label="Next step">&#8250;</button>

</div>

<script>(() => {
  const root = document.currentScript.closest('.fg-diagram');
  const TOTAL = 4, STEP_MS = 1400;
  // fg:begin timeline-core v1
  let step = 0, timer = null, held = false; // held: the reader paused; autoplay stays off
  function apply() {
    for (let i = 0; i <= TOTAL; i++) root.classList.remove('is-step-' + i);
    root.classList.add('is-step-' + step);
    root.dispatchEvent(new CustomEvent('fg:step', { detail: { step } }));
  }
  const tl = {
    get step() { return step; },
    get playing() { return timer !== null; },
    go(n) { step = ((n % (TOTAL + 1)) + TOTAL + 1) % (TOTAL + 1); apply(); },
    next() { tl.go(step + 1); },
    prev() { tl.go(step - 1); },
    play() { if (!timer) { timer = setInterval(() => tl.next(), STEP_MS); root.classList.add('is-playing'); } },
    pause() { clearInterval(timer); timer = null; root.classList.remove('is-playing'); },
  };
  const btn = (name) => root.querySelector('[data-fg="' + name + '"]');
  btn('prev').addEventListener('click', () => { held = true; tl.pause(); tl.prev(); });
  btn('next').addEventListener('click', () => { held = true; tl.pause(); tl.next(); });
  btn('play').addEventListener('click', () => { held = tl.playing; held ? tl.pause() : tl.play(); });
  const counter = btn('counter');
  function sync() {
    if (counter) counter.textContent = tl.step + ' / ' + TOTAL;
    btn('play').textContent = tl.playing ? '\u275A\u275A' : '\u25B6\uFE0E'; // FE0E: text glyph, not emoji
    btn('play').setAttribute('aria-pressed', String(tl.playing));
  }
  root.addEventListener('fg:step', sync);
  root.querySelectorAll('.fg-controls button').forEach((b) => b.addEventListener('click', sync));
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // fg:end timeline-core
  // fg:begin timeline-start v1
  apply();
  if (reduced) {
    tl.go(TOTAL); // show final state, manual stepping still available
  } else {
    const io = new IntersectionObserver(
      // The first callback reports any overlap as intersecting, so test the
      // ratio; a reader who paused keeps control until they press play.
      (entries) => entries.forEach((e) => {
        if (e.intersectionRatio < 0.3) tl.pause();
        else if (!held) tl.play();
      }),
      { threshold: 0.3 }
    );
    io.observe(root);
  }
  // fg:end timeline-start
})();</script>
